<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prototipo navegable del sistema de gestión de envíos de Ohana Envíos. Proyecto Integrador ATI — Universidad ORT Uruguay.">
<meta name="theme-color" content="#0D7052">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
  :root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
  body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#F2F6F3}
  img{max-width:100%} [hidden]{display:none!important}
</style>
<title>Ohana Envíos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F2F6F3; --card:#FFFFFF; --soft:#EAF1EC; --soft-2:#DCE7DF;
  --ink:#16221C; --ink-2:#5A6B61; --ink-3:#93A29A;
  --line:#E4EBE6;
  --brand:#0D7052; --brand-2:#0A5B42; --brand-soft:#E3F2EA; --brand-ink:#0A5B42;
  --mint:#D8F0E2;
  /* superficies "fuertes": fondo + texto que SIEMPRE contrastan entre sí */
  --solid:#0D7052; --solid-2:#0A5B42; --on-solid:#FFFFFF;
  --nav-bg:#16221C; --nav-ink:rgba(255,255,255,.62); --nav-pill:#FFFFFF;
  --ic-ink:var(--brand-ink);
  --ok:#0D7052; --ok-soft:#E3F2EA;
  --warn:#C77A1A; --warn-soft:#FDF2E2;
  --bad:#C4453D; --bad-soft:#FCECEA;
  --info:#2563A8; --info-soft:#E8F0F9;
  --gold:#E8B54B;
  --r:22px; --r-md:16px; --r-sm:12px;
  --sh:0 2px 12px rgba(22,34,28,.05);
  --sh-md:0 6px 24px rgba(22,34,28,.08);
  --sh-nav:0 8px 32px rgba(22,34,28,.16);
  --f:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --tap:52px;
  --navh:calc(76px + env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --card:#17211D; --soft:#1E2A25; --soft-2:#27352E;
  --ink:#EAF2ED; --ink-2:#9FB3A8; --ink-3:#6F8579;
  --line:#243029;
  --brand:#3FBE8C; --brand-2:#5FD3A4; --brand-soft:#1B3A2E; --brand-ink:#6FDCAE;
  --mint:#1B3A2E;
  --ok:#3FBE8C; --ok-soft:#1B3A2E;
  --warn:#E0A253; --warn-soft:#3A2D16;
  --bad:#E8756C; --bad-soft:#3D211E;
  --info:#6BA4E8; --info-soft:#1A2B44;
  --solid:#12765A; --solid-2:#0E6047; --on-solid:#FFFFFF;
  --nav-bg:#27352E; --nav-ink:rgba(255,255,255,.66); --nav-pill:#0E1613;
  --ic-ink:#6FDCAE;
  --sh:0 2px 12px rgba(0,0,0,.3); --sh-md:0 6px 24px rgba(0,0,0,.35);
  --sh-nav:0 8px 32px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0E1613; --card:#17211D; --soft:#1E2A25; --soft-2:#27352E;
  --ink:#EAF2ED; --ink-2:#9FB3A8; --ink-3:#6F8579;
  --line:#243029;
  --brand:#3FBE8C; --brand-2:#5FD3A4; --brand-soft:#1B3A2E; --brand-ink:#6FDCAE;
  --mint:#1B3A2E;
  --ok:#3FBE8C; --ok-soft:#1B3A2E;
  --warn:#E0A253; --warn-soft:#3A2D16;
  --bad:#E8756C; --bad-soft:#3D211E;
  --info:#6BA4E8; --info-soft:#1A2B44;
  --solid:#12765A; --solid-2:#0E6047; --on-solid:#FFFFFF;
  --nav-bg:#27352E; --nav-ink:rgba(255,255,255,.66); --nav-pill:#0E1613;
  --ic-ink:#6FDCAE;
  --sh:0 2px 12px rgba(0,0,0,.3); --sh-md:0 6px 24px rgba(0,0,0,.35);
  --sh-nav:0 8px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{display:flex;flex-direction:column;min-height:100%;max-width:520px;margin:0 auto;position:relative;background:var(--bg)}
@media(min-width:900px){.app{max-width:900px}}

/* ===== header ===== */
.hd{padding:14px 20px 6px;flex:none}
.hd-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.who{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--solid);color:var(--on-solid);
  display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.who-t{min-width:0}
.who-t .l{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:4px}
.who-t .n{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.hd-b{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--sh);
  display:grid;place-items:center;font-size:17px;color:var(--ink-2);flex:none}
.hd-b:active{transform:scale(.94)}

.title{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.16;margin:0 0 5px;text-wrap:balance}
.title em{font-style:normal;color:var(--brand);display:block}
.subtitle{font-size:14.5px;color:var(--ink-2);margin:0;line-height:1.4}

/* ===== rol ===== */
.roles{display:flex;gap:7px;padding:14px 20px 4px;flex:none}
.roles button{flex:1;min-height:42px;border-radius:14px;background:var(--card);
  font-size:13.5px;font-weight:700;color:var(--ink-2);box-shadow:var(--sh)}
.roles button[aria-pressed="true"]{background:var(--solid);color:var(--on-solid)}

.scroll{flex:none;overflow:visible;
  padding:12px 20px calc(var(--navh) + 24px)}
body.has-dock .scroll{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body.dock-over .scroll{padding-bottom:calc(var(--navh) + 84px)}
.stack{display:flex;flex-direction:column;gap:20px}

/* ===== nav pill flotante ===== */
.nav{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:50;display:flex;justify-content:center;padding:0 20px;pointer-events:none}
.nav-in{display:flex;align-items:center;gap:3px;background:var(--nav-bg);border-radius:32px;
  padding:7px;box-shadow:var(--sh-nav);pointer-events:auto;max-width:100%}
.nav button{min-height:46px;border-radius:26px;display:flex;align-items:center;gap:6px;
  padding:0 11px;color:var(--nav-ink);font-size:13px;font-weight:700;position:relative}
.nav button .icw{position:relative;display:grid;place-items:center;flex:none}
.nav button .ic{font-size:17px;line-height:1}
.nav button .lb{display:inline;white-space:nowrap}
.nav button[aria-pressed="true"]{background:var(--nav-pill);color:var(--brand)}
.nav .badge{position:absolute;top:-5px;right:-8px;background:var(--bad);color:var(--on-solid);font-size:10px;
  font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;
  padding:0 4px;border:2px solid var(--nav-bg)}
.nav button[aria-pressed="true"] .badge{border-color:var(--nav-pill)}
@media(max-width:390px){
  .nav{padding:0 10px}
  .nav-in{gap:1px;padding:6px}
  .nav button{padding:0 8px;font-size:12px;gap:4px}
  .nav button .ic{font-size:15px}
}

/* ===== section ===== */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h3{font-size:17px;font-weight:800;margin:0;letter-spacing:-.02em}
.sec-h .more{font-size:13.5px;font-weight:700;color:var(--brand)}

/* ===== tiles ===== */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.tile{background:var(--card);border-radius:var(--r-md);padding:15px 10px;display:flex;
  flex-direction:column;align-items:center;gap:9px;box-shadow:var(--sh);min-height:96px;
  justify-content:center;text-align:center;position:relative}
.tile:active{transform:scale(.97)}
.tile .icw{position:relative;flex:none}
.tile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  font-size:21px;color:var(--ic-ink);font-weight:700}
.tile .lb{font-size:12.5px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.tile .ct{position:absolute;top:-5px;right:-7px;background:var(--bad);color:var(--on-solid);
  font-size:10.5px;font-weight:800;min-width:20px;height:20px;border-radius:10px;
  display:grid;place-items:center;padding:0 5px;border:2px solid var(--card);
  box-shadow:0 2px 6px rgba(0,0,0,.18)}

/* ===== hero card ===== */
.hero{background:linear-gradient(135deg,var(--solid) 0%,var(--solid-2) 100%);
  border-radius:var(--r);padding:20px;color:var(--on-solid);position:relative;overflow:hidden;box-shadow:var(--sh-md)}
.hero-btn{display:block;width:100%;text-align:left}
.hero-btn:active{transform:scale(.99)}
.hero-btn:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.hero::after{content:"";position:absolute;right:-32px;top:-32px;width:150px;height:150px;
  border-radius:50%;background:rgba(255,255,255,.09)}
.hero-k{font-size:12px;font-weight:700;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.hero h4{font-size:21px;font-weight:800;margin:7px 0 4px;letter-spacing:-.025em;position:relative;line-height:1.2}
.hero p{margin:0;font-size:14px;opacity:.9;line-height:1.4;position:relative}
.hero .cta{margin-top:15px;background:var(--on-solid);color:var(--solid-2);border-radius:26px;
  min-height:44px;padding:0 20px;font-size:14.5px;font-weight:700;display:inline-flex;
  align-items:center;gap:7px;position:relative}
.hero .cta:active{transform:scale(.97)}

/* ===== stat row ===== */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:520px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border-radius:var(--r-md);padding:15px;box-shadow:var(--sh)}
.stat .n{font-size:27px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:5px}
.stat.hi{background:var(--solid);color:var(--on-solid)}
.stat.hi .l{color:rgba(255,255,255,.84)}

/* ===== cards de envío ===== */
.ec{background:var(--card);border-radius:var(--r-md);padding:15px;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:11px;width:100%;text-align:left}
.ec>button[data-open]{width:100%;display:flex;flex-direction:column;gap:11px}
.ec:active{transform:scale(.99)}
.ec-top{display:flex;align-items:flex-start;gap:12px}
.ec-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  font-size:20px;flex:none;background:var(--soft);color:var(--ic-ink);font-weight:700}
.ec-m{flex:1;min-width:0}
.ec-n{font-size:16px;font-weight:700;letter-spacing:-.015em;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-a{font-size:13.5px;color:var(--ink-3);line-height:1.35;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ec-code{font-size:11.5px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.ec-bot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding-top:11px;border-top:1px solid var(--line)}
.ec-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.ec-act{min-height:34px;border-radius:17px;padding:0 12px;font-size:12px;font-weight:800;width:100%}
.ec-act.label{background:var(--brand-soft);color:var(--brand-ink)}
.ec-act.pay{background:var(--warn-soft);color:var(--warn)}
.meta{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:600}

/* ===== pills ===== */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  padding:5px 11px;border-radius:20px;white-space:nowrap}
.p-pend{background:var(--soft-2);color:var(--ink-2)}
.p-asig{background:var(--info-soft);color:var(--info)}
.p-ret,.p-ruta{background:var(--warn-soft);color:var(--warn)}
.p-ent{background:var(--ok-soft);color:var(--ok)}
.p-inc{background:var(--bad-soft);color:var(--bad)}
.p-parc{background:var(--warn-soft);color:var(--warn)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.urg{background:var(--bad);color:var(--on-solid);font-size:10.5px;font-weight:800;padding:3px 8px;
  border-radius:20px;letter-spacing:.03em}

/* ===== progreso bultos ===== */
.prog{display:flex;gap:4px;align-items:center;flex:1;min-width:52px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--soft-2);max-width:26px}
.prog i.on{background:var(--brand)}
.prog i.warn{background:var(--warn)}
.prog i.bad{background:var(--bad)}

/* ===== botones ===== */
.btn{min-height:var(--tap);border-radius:16px;background:var(--card);box-shadow:var(--sh);
  padding:0 20px;font-size:15.5px;font-weight:700;color:var(--ink);display:inline-flex;
  align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--solid);color:var(--on-solid);box-shadow:0 4px 16px rgba(13,112,82,.26)}
.btn.soft{background:var(--soft);box-shadow:none;color:var(--ink-2)}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.full{width:100%}
.btn.lg{min-height:58px;font-size:16.5px;border-radius:19px}
.btn.sm{min-height:42px;padding:0 15px;font-size:13.5px;border-radius:13px}
.btn:disabled{opacity:.42}
.btnrow{display:flex;gap:10px}
.btnrow>.btn{flex:1}

/* En acciones guiadas se mantiene la nav cuando hace falta salida entre secciones. */
body.has-dock .nav{display:none}
/* Pantallas donde hay que poder seguir navegando: el dock se apoya sobre la nav. */
body.dock-over .nav{display:flex}
body.dock-over .dock{bottom:var(--navh);padding-bottom:10px;
  background:linear-gradient(to top,var(--bg) 72%,transparent)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:linear-gradient(to top,var(--bg) 58%,transparent);
  padding:26px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:520px;margin:0 auto;display:flex;gap:10px}
@media(min-width:900px){.dock-in{max-width:900px}}
.dock .btn{flex:1}

/* ===== search ===== */
.search{position:relative}
.search input{width:100%;min-height:var(--tap);border:0;background:var(--card);
  border-radius:18px;padding:0 18px 0 46px;font-size:15px;box-shadow:var(--sh);color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search .ic{position:absolute;left:17px;top:50%;transform:translateY(-50%);
  color:var(--ink-3);font-size:17px;pointer-events:none}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chips button{min-height:40px;border-radius:20px;background:var(--card);padding:0 16px;
  font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;flex:none;box-shadow:var(--sh)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ===== forms ===== */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:13.5px;font-weight:700;color:var(--ink-2);letter-spacing:-.01em}
.field input,.field select,.field textarea{min-height:var(--tap);border:1.5px solid transparent;
  background:var(--soft);border-radius:15px;padding:13px 16px;font-size:16px;width:100%;color:var(--ink)}
.field textarea{min-height:82px;resize:vertical;line-height:1.45}
.field select{appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;
  background-repeat:no-repeat;padding-right:44px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);
  background:var(--card);outline:none}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.err{font-size:13px;color:var(--bad);font-weight:700;display:flex;gap:6px;align-items:flex-start}
.checkline{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13.5px;font-weight:700}
.checkline input{width:18px;min-height:18px;height:18px;accent-color:var(--brand);flex:none}
.grid2{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:460px){.grid2{grid-template-columns:1fr 1fr;gap:0 14px}}

/* ===== stepper ===== */
.steps{display:flex;gap:7px}
.step{flex:1;display:flex;flex-direction:column;gap:7px;align-items:center}
.step .bar{height:5px;border-radius:3px;background:var(--soft-2);width:100%}
.step.on .bar{background:var(--brand)}
.step.done .bar{background:var(--brand);opacity:.45}
.step .lb{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.step.on .lb{color:var(--brand)}



/* ===== carga masiva ===== */
.cols{display:flex;flex-wrap:wrap;gap:7px}
.col{display:flex;align-items:center;gap:7px;background:var(--soft);border-radius:9px;
  padding:7px 11px 7px 7px}
.col-l{width:22px;height:22px;border-radius:6px;background:var(--card);display:grid;
  place-items:center;font-size:11px;font-weight:800;color:var(--ink-3);flex:none}
.col-n{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.dropzone{border:2.5px dashed var(--line-2);border-radius:var(--r);padding:32px 20px;
  display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);width:100%}
.dropzone:active{transform:scale(.99);border-color:var(--brand);background:var(--brand-soft)}
.dz-i{font-size:34px;color:var(--brand);line-height:1}
.dz-t{font-size:16.5px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-top:4px}
.dz-s{font-size:13px;color:var(--ink-3);font-weight:500}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rs{background:var(--card);border-radius:var(--r-md);padding:14px;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:3px;border:2px solid transparent}
.rs-n{font-size:27px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.rs-l{font-size:12px;color:var(--ink-3);font-weight:600}
.rs.ok{border-color:var(--ok)} .rs.ok .rs-n{color:var(--ok)}
.rs.bad{border-color:var(--bad)} .rs.bad .rs-n{color:var(--bad)}
.rs.warn{border-color:var(--warn)} .rs.warn .rs-n{color:var(--warn)}
.fila{display:flex;align-items:flex-start;gap:11px;padding:12px;border-radius:var(--r-sm);
  background:var(--soft);margin-bottom:8px}
.fila:last-of-type{margin-bottom:0}
.fila.bad{background:var(--bad-soft)} .fila.warn{background:var(--warn-soft)}
.fila-n{width:26px;height:26px;border-radius:8px;background:var(--card);display:grid;
  place-items:center;font-size:12px;font-weight:800;color:var(--ink-3);flex:none;
  font-variant-numeric:tabular-nums}
.fila-m{flex:1;min-width:0}
.fila-t{font-size:14.5px;font-weight:700;letter-spacing:-.015em;line-height:1.3}
.fila-s{font-size:12.5px;color:var(--ink-3);line-height:1.35;margin-top:1px}
.fila-e{font-size:12.5px;font-weight:700;color:var(--bad);margin-top:5px;line-height:1.35}
.fila-e.warn{color:var(--warn)}
.fila-x{width:32px;height:32px;display:grid;place-items:center;color:var(--ink-3);

.fila-ok{color:var(--ok);font-size:16px;font-weight:800;flex:none;padding-top:3px}


.opcion{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);

.op-t{font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.op-s{font-size:12.5px;color:var(--ink-3);font-weight:500;line-height:1.4}

.volver{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;

.volver:active{opacity:.6}

.rapidos{display:flex;gap:10px}
.rap{flex:1;background:var(--soft);border:2px solid transparent;border-radius:15px;padding:13px;
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.rap:active{transform:scale(.97)}
.rap.on{border-color:var(--brand);background:var(--brand-soft)}
.rap-d{font-size:13px;font-weight:700;color:var(--ink-2)}
.rap.on .rap-d{color:var(--brand-ink)}
.rap-n{font-size:19px;font-weight:800;letter-spacing:-.025em;color:var(--ink);font-variant-numeric:tabular-nums}
.rap-c{position:absolute;top:-7px;right:-6px;background:var(--brand);color:var(--on-solid);
  font-size:10.5px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;
  place-items:center;padding:0 5px;border:2px solid var(--bg)}

.otrodia{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);
  border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--sh);min-height:56px;text-align:left}
button.otrodia:active{transform:scale(.99)}
.otrodia.on{background:var(--brand-soft);box-shadow:none;padding:9px 9px 9px 15px}
.od-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;
  min-height:44px;border-radius:10px}
.od-main:active{opacity:.6}
.od-i{font-size:17px;color:var(--ink-3);flex:none}
.otrodia.on .od-i{color:var(--brand-ink)}
.od-t{flex:1;min-width:0;font-size:14.5px;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.otrodia.on .od-t{color:var(--brand-ink)}
.od-c{background:var(--brand);color:var(--on-solid);font-size:11px;font-weight:800;min-width:20px;
  height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;flex:none}
.od-x{font-size:12.5px;font-weight:700;color:var(--brand);background:var(--card);
  border-radius:20px;padding:0 14px;flex:none;min-height:40px;display:grid;place-items:center;
  box-shadow:var(--sh)}
.od-x:active{transform:scale(.95)}

/* ===== selector de día ===== */
.diapick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 4px;padding:2px 20px 6px}
.diapick::-webkit-scrollbar{display:none}
.dias{display:flex;gap:9px;margin-bottom:4px}
.dias .dp{flex:1;min-width:0}
.dp.otro{background:var(--soft);box-shadow:none;border-style:dashed;border-color:var(--line-2);flex:0 0 66px}
.dp.otro .dp-n{font-size:16px;color:var(--ink-3)}

/* calendario */
.calhead{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.calhead span{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center}
.calsem-t{font-size:12px;font-weight:700;color:var(--ink-3);margin:14px 0 8px;
  text-transform:capitalize}
.calsem{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cd2{background:var(--soft);border:2px solid transparent;border-radius:14px;padding:12px 4px 9px;
  display:flex;flex-direction:column;align-items:center;gap:5px;min-height:64px;justify-content:center}
.cd2:active{transform:scale(.95)}
.cd2.on{border-color:var(--brand);background:var(--brand-soft)}
.cd2.hoy .cd2-n{text-decoration:underline;text-underline-offset:3px}
.cd2-n{font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.cd2-c{background:var(--brand);color:var(--on-solid);font-size:10.5px;font-weight:800;
  min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.cd2-e{height:18px}
.dp{background:var(--card);border:2px solid transparent;border-radius:15px;padding:10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;flex:none;
  box-shadow:var(--sh);position:relative}
.dp:active{transform:scale(.96)}
.dp.on{border-color:var(--brand);background:var(--brand-soft)}
.dp-d{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:capitalize}
.dp.on .dp-d{color:var(--brand-ink)}
.dp-n{font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.dp-c{position:absolute;top:-6px;right:-5px;background:var(--brand);color:var(--on-solid);
  font-size:10px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;
  place-items:center;padding:0 5px;border:2px solid var(--bg)}
.dp.on .dp-c{background:var(--warn)}

/* ===== alerta de atrasados ===== */
.alerta{display:flex;align-items:center;gap:13px;width:100%;background:var(--bad-soft);
  border-radius:var(--r-md);padding:14px;text-align:left;min-height:68px}
.alerta:active{transform:scale(.99)}
.al-i{width:40px;height:40px;border-radius:13px;background:var(--bad);color:var(--on-solid);
  display:grid;place-items:center;font-size:18px;flex:none}
.al-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.al-t{font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:-.015em;line-height:1.3}
.al-s{font-size:12.5px;color:var(--ink-2);font-weight:500;line-height:1.35}

/* ===== selector de cadete ===== */
.cadpick{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 16px;
  padding:2px 20px 4px}
.cadpick::-webkit-scrollbar{display:none}
.cp{background:var(--soft);border:2px solid transparent;border-radius:16px;padding:12px 14px;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-width:88px;flex:none}
.cp:active{transform:scale(.97)}
.cp.on{border-color:var(--brand);background:var(--brand-soft)}
.cp-ic{font-size:23px;line-height:1}
.cp-n{font-size:13.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.cp-c{font-size:11.5px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cp.on .cp-c{color:var(--brand-ink)}

/* ===== toggle ===== */
.tog{display:flex;align-items:center;gap:13px;width:100%;background:var(--soft);
  border:2px solid transparent;border-radius:15px;padding:14px;text-align:left;min-height:68px}
.tog:active{transform:scale(.99)}
.tog.on{border-color:var(--warn);background:var(--warn-soft)}
.tog-i{width:40px;height:40px;border-radius:13px;background:var(--card);display:grid;
  place-items:center;font-size:17px;color:var(--ink-3);flex:none}
.tog.on .tog-i{background:var(--warn);color:var(--on-solid)}
.tog-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tog-t{font-size:15px;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.tog-s{font-size:12px;color:var(--ink-3);font-weight:500;line-height:1.35}
.tog-sw{width:50px;height:30px;border-radius:16px;background:var(--soft-2);flex:none;
  padding:3px;display:flex;transition:background .18s}
.tog.on .tog-sw{background:var(--warn);justify-content:flex-end}
.tog-sw i{width:24px;height:24px;border-radius:50%;background:var(--card);display:block;
  box-shadow:0 1px 3px rgba(0,0,0,.2)}
.frag{background:var(--warn);color:var(--on-solid);font-size:10.5px;font-weight:800;
  padding:3px 8px;border-radius:20px;letter-spacing:.03em;white-space:nowrap}

/* ===== contador de bultos ===== */
.qty{display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 0 4px}
.qty-b{width:62px;height:62px;border-radius:22px;background:var(--soft);font-size:30px;
  font-weight:600;color:var(--brand-ink);display:grid;place-items:center;line-height:1;flex:none}
.qty-b:active{transform:scale(.93)}
.qty-b:disabled{opacity:.3}
.qty-n{display:flex;flex-direction:column;align-items:center;min-width:94px}
.qty-n .q{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.qty-n .ql{font-size:14px;font-weight:700;color:var(--ink-3);margin-top:4px}
.qty-hint{text-align:center;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.qty-hint b{color:var(--brand-ink);font-weight:700}
.tamgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tam{background:var(--soft);border:2px solid transparent;border-radius:15px;padding:13px;
  display:flex;flex-direction:column;gap:2px;text-align:left;min-height:76px;justify-content:center}
.tam:active{transform:scale(.98)}
.tam.on{border-color:var(--brand);background:var(--brand-soft)}
.tam .tk{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.06em}
.tam.on .tk{color:var(--brand-ink)}
.tam .tl{font-size:15px;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.tam .te{font-size:11.5px;color:var(--ink-3);font-weight:500;line-height:1.3}

/* ===== paquetes ===== */
.pk{display:flex;align-items:center;gap:13px;padding:15px;border-radius:var(--r-sm);
  background:var(--soft);margin-bottom:10px;min-height:var(--tap);border:2px solid transparent}
.pk:last-child{margin-bottom:0}
.pk.on{border-color:var(--brand);background:var(--brand-soft)}
.pk-d{flex:1;min-width:0;font-size:14.5px;line-height:1.35}
.pk-d b{font-size:12.5px;color:var(--ink-3);font-weight:700;font-variant-numeric:tabular-nums}
.pk-n{font-size:12.5px;color:var(--ink-3);font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.chk{width:26px;height:26px;flex:none;accent-color:var(--brand);margin:0}
.pk-x{width:40px;height:40px;display:grid;place-items:center;color:var(--bad);font-size:22px;
  font-weight:700;flex:none;border-radius:11px;background:var(--bad-soft)}

/* ===== timeline ===== */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:7px;bottom:7px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:19px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:-24px;top:4px;width:12px;height:12px;
  border-radius:50%;background:var(--card);border:2.5px solid var(--line)}
.tl-i.hl::before{background:var(--brand);border-color:var(--brand)}
.tl-t{font-size:14.5px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.tl-m{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.4;font-weight:500}

/* ===== cadete ===== */
.cd{background:var(--card);border-radius:var(--r-md);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.cd:last-child{margin-bottom:0}
.cd.off{opacity:.55}
.cd-h{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.cd-av{width:46px;height:46px;border-radius:15px;background:var(--soft);display:grid;
  place-items:center;font-size:21px;flex:none;color:var(--ic-ink)}
.cd-m{flex:1;min-width:0}
.cd-n{font-size:15.5px;font-weight:700;letter-spacing:-.015em}
.cd-v{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:1px}
.assigned{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chipa{display:flex;align-items:center;gap:11px;background:var(--soft);border-radius:var(--r-sm);
  padding:11px 13px;font-size:14px;min-height:46px}
.chipa .cc{font-size:12px;color:var(--brand);font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.chipa .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600;line-height:1.35}
.chipa .x{width:34px;height:34px;display:grid;place-items:center;color:var(--ink-3);
  font-size:19px;font-weight:700;flex:none;margin:-6px -6px -6px 0;border-radius:10px}
.route-out{display:flex;flex-direction:column;gap:8px;margin-top:12px;background:var(--soft);
  border-radius:var(--r-sm);padding:12px}
.route-out.updating{pointer-events:none}
.route-out .panel-t{margin-bottom:2px}
.route-step{display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:start;font-size:13px;line-height:1.35;text-align:left}
.route-step.has-actions{grid-template-columns:28px 1fr 66px}
.route-step[data-routeenv]{cursor:pointer}
.route-step .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);color:var(--brand);font-size:11px;font-weight:800}
.route-step b{font-size:12.5px;color:var(--ink);display:block}
.route-step small{color:var(--ink-3);font-weight:600}
.route-step.done{opacity:.58}
.route-step.current{background:var(--brand-soft);border-radius:12px;padding:8px;margin:-8px}
.route-state{display:inline-flex;margin-left:6px;padding:2px 7px;border-radius:999px;background:var(--card);
  color:var(--ink-3);font-size:10.5px;font-weight:850;text-transform:uppercase}
.route-id{display:inline-flex;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--brand);
  color:var(--on-solid);font-size:10.5px;font-weight:900;font-variant-numeric:tabular-nums}
.route-progress{font-size:12.5px;color:var(--ink-3);font-weight:700;line-height:1.35;margin:-2px 0 4px}
.route-actions{display:flex;gap:6px;justify-content:flex-end}
.route-actions button{width:28px;height:28px;border-radius:9px;background:var(--card);color:var(--ink-2);
  font-weight:900;display:grid;place-items:center}
.route-actions button:disabled{opacity:.35;cursor:default}
.jday{display:flex;flex-direction:column;gap:10px}
.jday-cad{background:var(--card);border-radius:var(--r-md);padding:16px;box-shadow:var(--sh)}
.jday-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.jday-av{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px}
.jday-m{flex:1;min-width:0}
.jday-n{font-weight:800;font-size:16px;letter-spacing:-.015em}
.jday-s{font-size:12.5px;color:var(--ink-3);font-weight:700;margin-top:2px}
.jday-list{display:flex;flex-direction:column;gap:8px}
.jday-env{background:var(--soft);border-radius:var(--r-sm);padding:12px;display:grid;gap:7px;border:2px solid transparent;text-align:left}
.jday-env.hl{border-color:var(--brand);background:var(--brand-soft);animation:glow .9s ease}
@keyframes glow{0%{transform:scale(.99)}50%{transform:scale(1.012)}100%{transform:scale(1)}}
.jday-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.jday-title{font-size:14.5px;font-weight:800;line-height:1.25}
.jday-id{font-size:14px;font-weight:900;color:var(--brand);font-variant-numeric:tabular-nums;flex:none;
  background:var(--card);border-radius:999px;padding:4px 9px}
.jday-meta{font-size:12.5px;color:var(--ink-3);font-weight:650;line-height:1.35}
.jday-stops{display:grid;gap:5px;font-size:13px;line-height:1.35}
.jday-stops b{color:var(--ink)}
.jday-actions{display:flex;gap:8px;flex-wrap:wrap}
.jday-actions .btn{min-height:34px;padding:0 12px;font-size:12.5px}
/* ===== sheet ===== */
.sh-bg{position:fixed;inset:0;background:rgba(14,22,19,.5);z-index:80;display:flex;
  align-items:flex-end;justify-content:center;animation:fade .18s ease;backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(100%)}}
.sh{background:var(--bg);width:100%;max-width:520px;max-height:93vh;border-radius:28px 28px 0 0;
  display:flex;flex-direction:column;animation:rise .26s cubic-bezier(.32,.72,0,1)}
@media(min-width:900px){.sh{max-width:560px;border-radius:28px;margin-bottom:4vh}.sh-bg{align-items:center}}
.grab{width:40px;height:5px;background:var(--soft-2);border-radius:3px;margin:11px auto 0;flex:none}
.sh-h{padding:14px 20px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex:none}
.sh-h h3{font-size:20px;font-weight:800;margin:3px 0 0;letter-spacing:-.025em}
.sh-b{padding:0 20px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sh-f{padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex:none;
  background:var(--bg);border-top:1px solid var(--line)}
.sh-f .btn{flex:1}
.panel{background:var(--card);border-radius:var(--r-md);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.panel:last-child{margin-bottom:0}
.panel-t{font-size:12px;font-weight:800;color:var(--ink-3);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:13px}

/* ===== misc ===== */
.empty{text-align:center;padding:46px 20px;color:var(--ink-3)}
.empty .ic{font-size:42px;margin-bottom:12px}
.empty p{margin:0 0 4px;font-size:16px;font-weight:700;color:var(--ink-2)}
.empty small{font-size:13.5px}
.note{background:var(--info-soft);border-radius:var(--r-sm);padding:14px 16px;font-size:13.5px;
  color:var(--ink-2);line-height:1.5;display:flex;gap:11px;align-items:flex-start}
.note .ni{font-size:17px;flex:none;line-height:1.3}
.note.warn{background:var(--warn-soft)}
.note b{color:var(--ink);font-weight:700}
.toast{position:fixed;left:20px;right:20px;bottom:calc(var(--navh) + 18px);background:var(--ink);
  color:var(--bg);padding:16px 20px;border-radius:18px;font-size:14.5px;font-weight:700;
  box-shadow:var(--sh-nav);z-index:100;text-align:center;max-width:480px;margin:0 auto;
  animation:rise .22s ease}
.label-preview{background:#fff;color:#101816;border:2px dashed #aebbb6;border-radius:12px;
  padding:18px;font-family:Arial,sans-serif}
.label-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid #101816;
  padding-bottom:12px;margin-bottom:12px}
.label-brand{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.label-code{font-size:26px;font-weight:800;letter-spacing:.03em}
.label-row{display:grid;grid-template-columns:72px 1fr;gap:10px;font-size:13px;margin-top:9px}
.label-row b{color:#5f6f68;text-transform:uppercase;font-size:10px;letter-spacing:.08em}
.label-dest{font-size:18px;font-weight:800;line-height:1.2}
.label-bar{display:block;width:100%;height:64px;margin-top:16px;background:#fff}
.label-barcode-id{text-align:center;color:#101816;font-size:12px;font-weight:800;letter-spacing:.18em;margin-top:7px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;font-size:14.5px;align-items:baseline}
.kv dt{color:var(--ink-3);font-weight:700;font-size:12.5px}
.kv dd{margin:0;line-height:1.4;font-weight:500}
.tel{color:var(--brand);font-weight:700;text-decoration:none}
.bignext{background:var(--card);border-radius:var(--r);box-shadow:var(--sh-md);overflow:hidden}
.bignext .bt{background:var(--mint);padding:18px 20px}
.bignext .act{color:var(--brand-ink)}
.bignext .act{font-size:12px;font-weight:800;color:var(--brand-ink);letter-spacing:.06em;
  text-transform:uppercase;display:flex;align-items:center;gap:8px}
.bignext .ad{font-size:20px;font-weight:800;margin-top:8px;letter-spacing:-.03em;
  line-height:1.22;color:var(--ink)}
.bignext .bb{padding:18px 20px}

<body>
<div class="app">
  <div class="roles" role="group" aria-label="Rol">
    <button id="r-admin" aria-pressed="true">Admin</button>
    <button id="r-cadete" aria-pressed="false">Cadete</button>
    <button id="r-cliente" aria-pressed="false">Cliente</button>
  </div>

  const out=[],d=new Date();
  while(out.length<n){ if(habil(d))out.push(iso(d)); d.setDate(d.getDate()+1) }
  return out;
}

  if(diff===0)return'Hoy'; if(diff===1)return'Mañana';
  return d.toLocaleDateString('es-UY',{weekday:'short'}).replace('.','');

function bul(e){return{t:e.paquetes.length,d:e.paquetes.filter(p=>p.estado==='entregado').length,
  r:e.paquetes.filter(p=>['retirado','ruta','entregado'].includes(p.estado)).length}}
function sync(e){const{t,d}=bul(e);
  if(e.paquetes.every(p=>p.estado==='incidencia'))e.estado='incidencia';
  else if(d===t&&t>0)e.estado='entregado';
  else if(d>0&&d<t)e.estado='parcial';
  else if(e.paquetes.some(p=>p.estado==='retirado'))e.estado='retirado'}

function routeSteps(envs){
  const steps=[];
  envs.forEach((e,i)=>{
    steps.push({tipo:'R',k:'Retirar',who:e.cliente,addr:e.retiro,id:e.id});
    if(i>0){const prev=envs[i-1];steps.push({tipo:'D',k:'Entregar',prep:'a',who:prev.destinatario,addr:prev.entrega,id:prev.id})}
  });
  if(envs.length){const last=envs[envs.length-1];steps.push({tipo:'D',k:'Entregar',prep:'a',who:last.destinatario,addr:last.entrega,id:last.id})}
  return steps;
}

function stopKey(s){return s.tipo+':'+s.id}
function stopFromKey(k){
  const [tipo,id]=k.split(':');
  if(tipo==='S'){
    const c=CAD.find(x=>x.id===id);
    return c?{tipo,k:'Origen',who:'',addr:c.base,id:c.id}:null;
  }
  const e=ENVIOS.find(x=>x.id===id);
  if(!e)return null;
  return tipo==='R'
    ?{tipo,k:'Retirar',who:e.cliente,addr:e.retiro,id:e.id}
    :{tipo,k:'Entregar',prep:'a',who:e.destinatario,addr:e.entrega,id:e.id};
}
function routeKeysForEnvios(envs,cid=null){return [...(cid?['S:'+cid]:[]),...routeSteps(envs).map(stopKey)]}
function stopDone(s){
  if(s.tipo==='S')return true;
  const e=ENVIOS.find(x=>x.id===s.id);
  if(!e)return true;
  return s.tipo==='R'
    ?['retirado','ruta','parcial','entregado'].includes(e.estado)
    :e.estado==='entregado';
}
function envioMovible(id){
  return !Object.values(ROUTE_STOPS).flat().map(stopFromKey).filter(Boolean)
    .some(s=>s.id===id&&stopDone(s));
}
function syncRouteStops(cid,envs){
  const wanted=routeKeysForEnvios(envs,cid),actual=ROUTE_STOPS[cid]||[];
  const merged=[...actual.filter(k=>wanted.includes(k)),...wanted.filter(k=>!actual.includes(k))];
  const done=[],future=[];
  merged.forEach(k=>{
    const s=stopFromKey(k);
    (s&&stopDone(s)?done:future).push(k);
  });
  ROUTE_STOPS[cid]=[...done,...future];
  return ROUTE_STOPS[cid];
}

function routeListHTML(envs,title='Orden devuelto por ruteador externo',cid=null,editable=false){
  const steps=(cid?syncRouteStops(cid,envs).map(stopFromKey).filter(Boolean):routeSteps(envs));
  const done=steps.map(stopDone),current=done.findIndex(x=>!x);
  const currentStep=current>=0?steps[current]:null;
  return `<div class="route-out"><div class="panel-t">${esc(title)}</div>
    ${editable?`<div class="route-progress">${currentStep
      ?`Va por parada ${current+1}: ${currentStep.k.toLowerCase()} en ${esc(currentStep.who)}`
      :'Ruta completada'}</div>`:''}
    ${steps.map((s,i)=>{
      const locked=editable&&(current<0||i<=current),state=s.tipo==='S'?'Origen':done[i]?'Completada':i===current?'Siguiente':'Futura';
      const title=s.tipo==='S'?'Origen':`${s.k} ${s.prep||'en'} ${esc(s.who)}`;
      return `<div class="route-step ${editable?'has-actions':''} ${done[i]?'done':i===current?'current':''}" data-stop="${stopKey(s)}" ${s.tipo==='S'?'':'data-routeenv="'+s.id+'"'}><span class="num">${i+1}</span>
      <div><b>${title}${s.tipo==='S'||done[i]||i===current?`<span class="route-state">${state}</span>`:`<span class="route-id">${s.id}</span>`}</b><small>${esc(s.addr)}</small></div>
      ${editable?`<div class="route-actions">
        <button data-moverstop="${cid}|${i}|-1" ${locked||i===0||i-1<=current?'disabled':''} aria-label="Subir parada">↑</button>
        <button data-moverstop="${cid}|${i}|1" ${locked||i===steps.length-1?'disabled':''} aria-label="Bajar parada">↓</button>
      </div>`:''}</div>`}).join('')}
  </div>`;
}

function externalRouteList(ids,cid=null){
  const envs=ids.map(id=>ENVIOS.find(e=>e.id===id)).filter(Boolean);
  return routeListHTML(envs,'Orden devuelto por ruteador externo',cid);
}

function simularRuteadorExterno(){
  const enP=Object.values(PLANI).flat();
  const pendientes=ENVIOS.filter(e=>e.estado==='pendiente'&&!enP.includes(e.id)
    &&(e.fecha===DIA||(DIA===HOY&&esPasado(e.fecha))))
    .sort((a,b)=>(a.ventana||'').localeCompare(b.ventana||'')||a.entrega.localeCompare(b.entrega));
  const cadetes=CAD.filter(c=>c.disp);
  if(!pendientes.length){toast('No hay envíos para optimizar');return}
  if(!cadetes.length){toast('No hay cadetes disponibles');return}
  PLANI={c1:[...(PLANI.c1||[])],c2:[...(PLANI.c2||[])],c3:[...(PLANI.c3||[])]};
  pendientes.forEach((e,i)=>PLANI[cadetes[i%cadetes.length].id].push(e.id));
  ROUTE_PLAN={c1:[...PLANI.c1],c2:[...PLANI.c2],c3:[...PLANI.c3]};
  ROUTE_STOPS={c1:[],c2:[],c3:[]};
  ROUTED=true;PICK=null;toast('Ruteador externo devolvió '+pendientes.length+' envío'+(pendientes.length>1?'s':'')+' por cadete');
}

function enviosCadeteOrdenados(cid){
  const envs=ENVIOS.filter(e=>e.cadete===cid&&!['entregado','cancelado'].includes(e.estado));
  if(!envs.length)return[];
  const keys=syncRouteStops(cid,envs);
  const nextKey=e=>(e.estado==='asignado'?'R':'D')+':'+e.id;
  return envs.slice().sort((a,b)=>{
    const ia=keys.indexOf(nextKey(a)),ib=keys.indexOf(nextKey(b));
    if(ia!==ib)return (ia<0?999:ia)-(ib<0?999:ib);
    return (a.ventana||'').localeCompare(b.ventana||'')||a.id.localeCompare(b.id);
  });
}

function refreshRouteList(routeEl,cid){
  if(!routeEl)return false;
  const before=new Map([...routeEl.querySelectorAll('.route-step')]
    .map(el=>[el.dataset.stop,el.getBoundingClientRect()]));
  const g=enviosJornadaPorCadete().find(x=>x.cadete.id===cid);
  if(!g)return false;
  const title=routeEl.querySelector('.panel-t')?.textContent||('Ruta armada para '+cadN(cid));
  const wrap=document.createElement('div');
  wrap.innerHTML=routeListHTML(g.envs,title,cid,true);
  const next=wrap.firstElementChild;
  next.classList.add('updating');
  routeEl.replaceWith(next);
  requestAnimationFrame(()=>{
    next.querySelectorAll('.route-step').forEach(el=>{
      const prev=before.get(el.dataset.stop);
      if(!prev)return;
      const now=el.getBoundingClientRect(),dy=prev.top-now.top;
      if(dy)el.animate([{transform:`translateY(${dy}px)`},{transform:'translateY(0)'}],
        {duration:210,easing:'cubic-bezier(.2,.8,.2,1)'});
    });
    setTimeout(()=>next.classList.remove('updating'),230);
  });
  return true;
}

  if(m.paso===2){
    const ok=m.filas.filter(r=>!r.err&&!r.dup&&!m.excl.includes(r.f));

    const fila=r=>`<div class="fila ${r.err?'bad':r.dup?'warn':''}">
      <span class="fila-n">${r.f}</span>
      <div class="fila-m"><div class="fila-t">${esc(r.dest||'—')}</div>

        <div class="fila-s">${esc(r.dir)} · ${r.ven||'sin horario'} · ${r.bultos}b</div>
        ${r.err?`<div class="fila-e">⚠ ${esc(r.err)}</div>`:''}

      <div class="rs ${conErr.length?'bad':''}"><span class="rs-n">${conErr.length}</span><span class="rs-l">Con error</span></div>

    ${conErr.length||dups.length?`<div class="panel">
      <div class="panel-t">Requieren tu atención</div>
      ${[...conErr,...dups].map(fila).join('')}
      <span class="hint" style="margin-top:12px;display:block">Excluí las filas que no quieras crear, o corregí la planilla y volvé a subirla.</span>
    </div>`:''}
    ${ok.length?`<div class="panel"><div class="panel-t">Listos para crear (${ok.length})</div>

    ${m.excl.length?`<button class="btn soft full" id="m-restaurar">Restaurar ${m.excl.length} fila${m.excl.length>1?'s':''} excluida${m.excl.length>1?'s':''}</button>`:''}

        ${ok.length?`Crear ${ok.length} envío${ok.length>1?'s':''}`:'Nada para crear'}</button>
    </div></div>`;
  }
  // Paso 3 — resultado
  return `<div class="hero"><div class="hero-k">Carga completada</div>
    <h4>${m.creados} envío${m.creados>1?'s':''} creado${m.creados>1?'s':''}</h4>

    <div class="btnrow">
      <button class="btn lg soft" id="m-otra">Cargar otra</button>
      <button class="btn lg pri" data-go="inicio">Ir a planificar</button></div>`;
}

function histCliente(e){
  const hs=e.hist;
  const primero=hs[0]||evt('Pedido recibido','Tenemos la solicitud del envío.','Ohana');
  const out=[{t:'Pedido recibido',d:'Tenemos la solicitud del envío.',ts:primero.ts}];
  const ret=[...hs].reverse().find(h=>h.t.startsWith('Retiro confirmado'));
  if(ret)out.push({t:'Retirado',d:'El envío ya fue retirado y sigue camino a destino.',ts:ret.ts});
  const ent=[...hs].reverse().find(h=>h.t.startsWith('Entrega confirmada'));
  if(ent)out.push({t:'Entregado',d:'El envío fue entregado correctamente.',ts:ent.ts});
  const inc=[...hs].reverse().find(h=>h.t.includes('no concretad')||h.t.includes('Incidencia'));
  if(inc)out.push({t:'Incidencia registrada',d:'Estamos revisando el próximo paso del envío.',ts:inc.ts});
  return out;
}

function enviosJornadaPorCadete(){
  return CAD.map(c=>{
    const ids=[...(PLANI[c.id]||[])];
    (ROUTE_PLAN[c.id]||[]).forEach(id=>{
      const e=ENVIOS.find(x=>x.id===id);
      if(e&&e.fecha===DIA&&!['cancelado'].includes(e.estado)&&!ids.includes(id))ids.push(id);
    });
    ENVIOS.filter(e=>e.cadete===c.id&&e.fecha===DIA&&!['cancelado'].includes(e.estado))
      .sort((a,b)=>(a.ventana||'').localeCompare(b.ventana||'')||a.id.localeCompare(b.id)).forEach(e=>{
      if(e.cadete===c.id&&e.fecha===DIA&&!['cancelado'].includes(e.estado)&&!ids.includes(e.id))ids.push(e.id);
    });
    const envs=ids.map(id=>ENVIOS.find(e=>e.id===id)).filter(Boolean);
    return {cadete:c,envs};
  }).filter(x=>x.envs.length);
}

  '231113','231311','112133','112331','132131','113123','113321','133121','313121','211331',
  '231131','213113','213311','213131','311123','311321','331121','312113','312311','332111',
  '314111','221411','431111','111224','111422','121124','121421','141122','141221','112214',

  '114131','311141','411131','211412','211214','211232','2331112'
];
function barcode128SVG(text){
  const codes=[104], chars=String(text).replace(/[^\x20-\x7f]/g,'');
  for(const ch of chars)codes.push(ch.charCodeAt(0)-32);
  let sum=codes[0];for(let i=1;i<codes.length;i++)sum+=codes[i]*i;
  codes.push(sum%103,106);
  const quiet=10,h=58;
  let x=quiet,rects='';
  codes.forEach(code=>{
    const p=CODE128[code];
    [...p].forEach((w,i)=>{w=Number(w);if(i%2===0)rects+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=w});
  });
  const vb=x+quiet;
  return `<svg class="label-bar" viewBox="0 0 ${vb} ${h}" preserveAspectRatio="none" role="img" aria-label="Código de barras ${esc(chars)}">${rects}</svg>`;
}

  const h=HEAD[TAB]||{t:'',s:''};

  const who={admin:{av:'FC',l:'◔ Jornada de hoy',n:'Fernando Coito'},
    cadete:{av:'MR',l:'🛵 Moto · en ruta',n:'Martín Rodríguez'},
    cliente:{av:'BA',l:'◷ Cliente',n:'Boutique Amalia'}}[ROL];
  $('#av').textContent=who.av; $('#wl').textContent=who.l; $('#wn').textContent=who.n;
  const pend=ENVIOS.filter(e=>e.estado==='pendiente').length;
  $('#nav').innerHTML=items.map(i=>`<button data-tab="${i.k}" aria-pressed="${TAB===i.k}">

    ${i.k==='inicio'&&pend?`<span class="badge">${pend}</span>`:''}</span>

  const V={inicio:vInicio,envios:vEnvios,alta:vAlta,cadetes:vCadetes,tareas:vTareas,hoy:vHoy,mis:vMis,
    nuevo:vAlta,masiva:vMasiva};
  const html=(V[TAB]||vInicio)();
  $('#view').innerHTML=html;
  const dock=html.includes('class="dock"');
  // Formularios de admin/cliente mantienen la nav como salida; tareas operativas priorizan la acción.
  const navOverDock=dock&&['inicio','alta','nuevo','masiva'].includes(TAB);
  document.body.classList.toggle('has-dock',dock);

  $('#layer').innerHTML=(SEL?shDet():'')+(OP?shOp():'')+(JORNADA?shJornada():'')+(PICK?shPick():'')+(MOVE?shMove():'')+(ATRAS?shAtras():'')+(CAL?shCal():'')+
    (CREATED?shCreated():'')+(LABEL?shLabel():'')+(PAY?shPay():'')+
    (TOAST?`<div class="toast">${esc(TOAST)}</div>`:'');
  ['admin','cadete','cliente'].forEach(r=>{const el=$('#r-'+r);if(el)el.setAttribute('aria-pressed',String(ROL===r))});
  document.body.style.overflow=(SEL||OP||PICK||MOVE||JORNADA||ATRAS||CAL||LABEL||CREATED||PAY)?'hidden':'';
}

/* ===== eventos ===== */
document.addEventListener('click',ev=>{
  const t=ev.target,c=s=>t.closest(s);
  const closeHit=s=>{const el=c(s);return el&&(t===el||el.classList.contains('hd-b'))};
  if(c('#theme')){const r=document.documentElement;
    const dk=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
    r.setAttribute('data-theme',dk?'light':'dark');return}
  for(const r of ['admin','cadete','cliente'])if(c('#r-'+r)){ROL=r;SEL=OP=PICK=MOVE=null;JORNADA=false;DRAFT=null;
    TAB=NAV[r][0].k;topPage();render();return}
  const tb=c('[data-tab]');if(tb){TAB=tb.dataset.tab;topPage();render();return}
  const go=c('[data-go]');if(go){
    if(go.dataset.go==='incidencias'){TAB='envios';vEnvios.f='incidencia';vEnvios.q=''}
    else if(go.dataset.go==='atrasados'){TAB='envios';vEnvios.f='atrasados';vEnvios.q=''}
    else TAB=go.dataset.go;
    topPage();render();return}
  const op=c('[data-open]');if(op){const e=ENVIOS.find(x=>x.id===op.dataset.open);
    if(ROL==='admin'&&e&&esPasado(e.fecha)&&['pendiente','asignado','incidencia'].includes(e.estado)){
      ATRAS=e.id;JORNADA=false;render();return}
    SEL=op.dataset.open;JORNADA=false;render();return}
  if(closeHit('[data-close]')){SEL=null;render();return}
  if(closeHit('[data-closeop]')){OP=null;render();return}
  if(closeHit('[data-closepick]')){PICK=null;render();return}
  if(closeHit('[data-closemove]')){MOVE=null;render();return}
  if(closeHit('[data-closejornada]')){JORNADA=false;render();return}
  if(closeHit('[data-closelabel]')){LABEL=null;render();return}
  if(closeHit('[data-closecreated]')){CREATED=null;render();return}
  if(closeHit('[data-closepay]')){PAY=null;render();return}

  const ret=c('[data-retiro]');if(ret){OP={tipo:'retiro',envio:ret.dataset.retiro,obs:''};SEL=null;render();return}
  const ent=c('[data-entrega]');if(ent){OP={tipo:'entrega',envio:ent.dataset.entrega,obs:'',receptor:''};SEL=null;render();return}

  if(c('[data-fallo]')&&OP){const e=ENVIOS.find(x=>x.id===OP.envio);
    e.paquetes.forEach(p=>{if(['pendiente','asignado','retirado','ruta'].includes(p.estado))p.estado='incidencia'});
    e.estado='incidencia';
    e.hist.push(evt(OP.tipo==='retiro'?'Retiro no concretado':'Entrega no concretada',
      (OP.obs||'Sin observaciones')+' · para reprogramar','Martín R.'));
    OP=null;toast('Incidencia registrada');return}

  if(c('[data-confirmop]')&&OP){
    const e=ENVIOS.find(x=>x.id===OP.envio),r=OP.tipo==='retiro';
    if(!r&&!(OP.receptor||'').trim()){OP.err='Poné el nombre de quien recibe.';render();
      setTimeout(()=>document.querySelector('#op-rec')?.focus(),60);return}
    const el=e.paquetes.filter(p=>r?['pendiente','asignado'].includes(p.estado):['retirado','ruta'].includes(p.estado));
    el.forEach(p=>p.estado=r?'retirado':'entregado');
    const n=el.length;
    if(r){e.custodia='Martín Rodríguez';
      e.hist.push(evt(`Retiro confirmado · ${n} bulto${n>1?'s':''}`,
        `Custodia: remitente → Martín Rodríguez${OP.obs?' · '+OP.obs:''}`,'Martín R.'))}
    else{e.custodia=`Destinatario (${OP.receptor})`;
      e.hist.push(evt(`Entrega confirmada · ${n} bulto${n>1?'s':''}`,
        `Recibió: ${OP.receptor}${OP.obs?' · '+OP.obs:''}`,'Martín R.'))}
    sync(e);OP=null;toast(`${r?'Retiro':'Entrega'} confirmada ✓`);return}

  const add=c('[data-addto]');if(add){PICK={cadete:add.dataset.addto,sel:[]};render();return}
  if(c('#asignar-flow')){PICK={cadete:CAD.find(x=>x.disp).id,sel:[]};render();return}
  if(c('#optimizar-rutas')){simularRuteadorExterno();render();return}
  if(c('[data-jornada]')){JORNADA=true;render();return}
  const jf=c('[data-jfilt]');if(jf){JFILT=jf.dataset.jfilt;render();return}
  const ins=c('[data-insertruta]');if(ins){PICK={cadete:ins.dataset.insertruta,sel:[],direct:true};render();return}
  const me=c('[data-moveenv]');if(me){MOVE={id:me.dataset.moveenv,to:null};render();return}
  const mt=c('[data-moveto]');if(mt&&MOVE){MOVE.to=mt.dataset.moveto;render();return}
  if(c('[data-confirmmove]')&&MOVE&&MOVE.to){const e=ENVIOS.find(x=>x.id===MOVE.id);
    if(!e||!envioMovible(e.id)){flashToast('Ese envío ya tiene paradas completadas');MOVE=null;render();return}
    const from=e.cadete,to=MOVE.to;
    for(const k in PLANI)PLANI[k]=PLANI[k].filter(id=>id!==e.id);
    for(const k in ROUTE_PLAN)ROUTE_PLAN[k]=ROUTE_PLAN[k].filter(id=>id!==e.id);
    for(const k in ROUTE_STOPS)ROUTE_STOPS[k]=ROUTE_STOPS[k].filter(id=>!id.endsWith(':'+e.id));
    e.cadete=to;e.estado='asignado';e.paquetes.forEach(p=>{if(p.estado!=='entregado')p.estado='asignado'});
    ROUTE_PLAN[to]=[...(ROUTE_PLAN[to]||[]),e.id];
    e.hist.push(evt('Reasignado de '+cadN(from)+' a '+cadN(to),'Cambio manual dentro de la jornada armada','Admin'));
    MOVE=null;JORNADA=true;toast('Envío movido a '+cadN(to));return}
  const re=c('[data-routeenv]');if(re&&!c('[data-moverstop]')){
    const card=document.querySelector(`.jday-env[data-env="${re.dataset.routeenv}"]`);
    if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.classList.remove('hl');void card.offsetWidth;card.classList.add('hl')}
    return}
  const mv=c('[data-moverstop]');if(mv){
    const routeEl=mv.closest('.route-out');
    const [cid,ix,dir]=mv.dataset.moverstop.split('|'),i=Number(ix),j=i+Number(dir),arr=ROUTE_STOPS[cid]||[];
    const steps=arr.map(stopFromKey).filter(Boolean),done=steps.map(stopDone),current=done.findIndex(x=>!x);
    if(current<0||(i<=current||j<=current)){flashToast('Solo podés mover paradas futuras');return}
    if(arr[j]){[arr[i],arr[j]]=[arr[j],arr[i]];ROUTE_STOPS[cid]=arr;flashToast('Orden de ruta actualizado')}
    if(!refreshRouteList(routeEl,cid))render();return}
  const cp=c('[data-cadpick]');if(cp&&PICK){PICK.cadete=cp.dataset.cadpick;render();return}

  const tp=c('[data-tipo]');if(tp&&MAS){MAS.tipo=tp.dataset.tipo;MAS.paso=1;
    topPage();render();return}
  if(c('[data-paso0]')&&MAS){MAS.paso=0;MAS.tipo=null;MAS.err=null;topPage();render();return}
  const mf=c('[data-mfecha]');if(mf&&MAS){MAS.fecha=mf.dataset.mfecha;render();return}
  if(c('#m-plantilla')){toast('Plantilla descargada');return}
  if(c('#m-subir')){const m=MAS;
    if(m.tipo==='cliente'&&!m.cliente){m.err='Elegí primero de qué cliente son los envíos.';render();return}
    m.err=null;m.filas=m.tipo==='general'?PLANILLA_GRAL():PLANILLA();
    m.excl=[];m.paso=2;topPage();render();
    toast(m.filas.length+' filas leídas');return}
  const ex=c('[data-excl]');if(ex&&MAS){const f=+ex.dataset.excl;
    MAS.excl=MAS.excl.includes(f)?MAS.excl.filter(x=>x!==f):[...MAS.excl,f];render();return}
  if(c('#m-restaurar')&&MAS){MAS.excl=[];render();return}
  if(c('#m-volver')&&MAS){MAS.paso=1;topPage();render();return}
  if(c('#m-otra2')){MAS=null;topPage();render();return}
  if(c('#m-otra')){MAS=null;topPage();render();return}
  if(c('#m-confirmar')&&MAS){const m=MAS;
    const ok=m.filas.filter(r=>!r.err&&!r.dup&&!m.excl.includes(r.f));
    ok.forEach(r=>{const cli=r.cli||m.cliente;
      const e=mk({cliente:cli,
      retiro:(CLI.find(x=>x.n===cli)||{dirs:['—']}).dirs[0],destinatario:r.dest,tel:r.tel,
      entrega:r.dir,fecha:m.fecha,ventana:r.ven,
      paquetes:Array.from({length:r.bultos},()=>({tam:r.tam}))});
      e.hist=[evt('Creado por carga masiva',
        (m.tipo==='general'?'Planilla general':'Planilla de '+m.cliente)+' · fila '+r.f,'Admin')];
      ENVIOS.unshift(e)});
    m.creados=ok.length;m.excl=[...m.excl,...m.filas.filter(r=>r.err||r.dup).map(r=>r.f)]
      .filter((v,i,a)=>a.indexOf(v)===i);
    m.paso=3;topPage();render();
    toast(ok.length+' envío'+(ok.length>1?'s':'')+' creado'+(ok.length>1?'s':''));return}
  // El día concreto gana sobre abrir el calendario: "Volver a hoy" vive dentro del mismo bloque.
  const diaX=c('[data-dia]');if(diaX){DIA=diaX.dataset.dia;CAL=false;topPage();render();return}
  if(c('#abrir-cal')){CAL=true;render();return}
  if(closeHit('[data-closecal]')){CAL=false;render();return}
  const fe=c('[data-fecha]');if(fe&&DRAFT){
    DRAFT.fecha=fe.dataset.fecha;
    if(DRAFT.ventana&&!franjaVigente(DRAFT.ventana,DRAFT.fecha))DRAFT.ventana='';
    render();return}
  const at=c('[data-atras]');if(at){ATRAS=at.dataset.atras;render();return}
  if(closeHit('[data-closeatras]')){ATRAS=null;render();return}
  const rep=c('[data-reprog]');if(rep){const e=ENVIOS.find(x=>x.id===ATRAS);
    e.fecha=rep.dataset.reprog;e.estado='pendiente';e.cadete=null;
    e.paquetes.forEach(p=>{if(p.estado!=='entregado')p.estado='pendiente'});
    for(const k in PLANI)PLANI[k]=PLANI[k].filter(id=>id!==e.id);
    for(const k in ROUTE_PLAN)ROUTE_PLAN[k]=ROUTE_PLAN[k].filter(id=>id!==e.id);
    for(const k in ROUTE_STOPS)ROUTE_STOPS[k]=ROUTE_STOPS[k].filter(id=>!id.endsWith(':'+e.id));
    e.hist.push(evt('Reprogramado para '+labelDia(e.fecha).toLowerCase()+' '+numDia(e.fecha),
      'Vuelve a quedar pendiente de asignación','Admin'));
    DIA=e.fecha;TAB='inicio';ATRAS=null;topPage();toast('Reprogramado para '+numDia(e.fecha)+' · listo para asignar');return}
  if(c('[data-devolver]')){const e=ENVIOS.find(x=>x.id===ATRAS);
    e.estado='cancelado';e.custodia='Devuelto al remitente ('+e.cliente+')';e.cadete=null;
    e.paquetes.forEach(p=>p.estado='cancelado');
    e.hist.push(evt('Devuelto al remitente','El envío se cierra sin entrega · custodia de vuelta en origen','Admin'));
    ATRAS=null;toast('Devuelto a '+e.cliente);return}
  if(c('[data-confirmpick]')&&PICK){
    if(PICK.direct){
      PICK.sel.forEach(id=>{const e=ENVIOS.find(x=>x.id===id);
        if(e){for(const k in PLANI)PLANI[k]=PLANI[k].filter(x=>x!==id);
          e.estado='asignado';e.cadete=PICK.cadete;e.paquetes.forEach(p=>p.estado='asignado');
          e.hist.push(evt('Insertado en ruta de '+cadN(PICK.cadete),'Agregado a una jornada ya armada','Admin'));
          ROUTE_PLAN[PICK.cadete]=[...(ROUTE_PLAN[PICK.cadete]||[]).filter(x=>x!==id),id]}});      
      const n=PICK.sel.length,quien=cadN(PICK.cadete).split(' ')[0];
      PICK=null;JORNADA=true;toast(n+' envío'+(n>1?'s':'')+' insertado'+(n>1?'s':'')+' en la ruta de '+quien);return}
    PICK.sel.forEach(id=>{for(const k in PLANI)PLANI[k]=PLANI[k].filter(x=>x!==id);PLANI[PICK.cadete].push(id)});
    ROUTED=false;const n=PICK.sel.length,quien=cadN(PICK.cadete).split(' ')[0];
    PICK=null;toast(n+' envío'+(n>1?'s':'')+' para '+quien);return}
  const un=c('[data-unassign]');if(un){for(const k in PLANI)PLANI[k]=PLANI[k].filter(x=>x!==un.dataset.unassign);
    for(const k in ROUTE_PLAN)ROUTE_PLAN[k]=ROUTE_PLAN[k].filter(x=>x!==un.dataset.unassign);ROUTED=false;
    for(const k in ROUTE_STOPS)ROUTE_STOPS[k]=ROUTE_STOPS[k].filter(x=>!x.endsWith(':'+un.dataset.unassign));
    render();return}
  if(c('#confirmar')){let n=0;
    ROUTE_PLAN={c1:[...PLANI.c1],c2:[...PLANI.c2],c3:[...PLANI.c3]};
    for(const cid in PLANI)PLANI[cid].forEach(id=>{const e=ENVIOS.find(x=>x.id===id);
      if(e){e.estado='asignado';e.cadete=cid;e.paquetes.forEach(p=>p.estado='asignado');
        e.hist.push(evt('Asignado a '+cadN(cid),'Responsabilidad operativa · la custodia no cambia','Admin'));n++}});
    PLANI={c1:[],c2:[],c3:[]};ROUTED=false;toast(n+' envío'+(n>1?'s':'')+' asignado'+(n>1?'s':'')+' ✓');return}

  const tg=c('[data-toggle]');if(tg){const cd=CAD.find(x=>x.id===tg.dataset.toggle);
    const act=ENVIOS.filter(e=>e.cadete===cd.id&&!['entregado','cancelado'].includes(e.estado)).length;
    if(cd.disp&&act){toast('Tiene '+act+' tarea(s) activa(s): reasignalas primero');return}
    cd.disp=!cd.disp;render();return}

  const f=c('[data-f]');if(f){vEnvios.f=f.dataset.f;render();return}
  if(c('[data-label]')){LABEL=c('[data-label]').dataset.label;CREATED=null;render();return}
  if(c('[data-pay]')){PAY=c('[data-pay]').dataset.pay;render();return}
  if(c('#print-label')){toast('Impresión simulada');return}
  if(c('#pay-file')){toast('Archivo seleccionado');return}
  if(c('#pay-confirm')){PAY=null;toast('Comprobante guardado');return}
  if(c('#f-frag')){DRAFT.fragil=!DRAFT.fragil;render();return}
  if(c('#pk-mas')){const t=DRAFT.paquetes[0].tam;
    if(DRAFT.paquetes.length<20)DRAFT.paquetes.push({tam:t});render();return}
  if(c('#pk-menos')){if(DRAFT.paquetes.length>1)DRAFT.paquetes.pop();render();return}
  const tm=c('[data-tam]');if(tm){DRAFT.paquetes.forEach(p=>p.tam=tm.dataset.tam);render();return}
  if(c('#atras')){DRAFT.paso--;DRAFT.err={};topPage();render();return}
  if(c('#sig')){const d=DRAFT;d.err={};
    if(d.paso===1){d.retiro=d.retiro.trim();d.retiroNuevo=d.retiroNuevo.trim();
      if(!d.cliente)d.err.cliente='Elegí quién envía.';if(!retiroDraft(d))d.err.retiro='Falta completar la dirección de retiro.'}
    if(d.paso===2){d.entrega=entregaDraft(d);if(!d.dest.trim())d.err.dest='Falta quién recibe.';
      if(!d.entrega)d.err.entrega='Falta completar la dirección de entrega.';
      if(!d.ventana)d.err.ventana='Elegí un horario.';
      else if(!franjaVigente(d.ventana,d.fecha))d.err.ventana='Esa franja ya pasó. Elegí otra.'}
    if(Object.keys(d.err).length){render();return}
    d.paso++;topPage();render();return}
  if(c('#crear')){const d=DRAFT;
    const cl=CLI.find(x=>x.n===d.cliente),retiro=retiroDraft(d);
    if(cl&&d.favRetiro&&retiro&&!cl.dirs.some(x=>x.toLowerCase()===retiro.toLowerCase()))cl.dirs.push(retiro);
    const e=mk({cliente:d.cliente,retiro:retiro,destinatario:d.dest,tel:d.tel,entrega:entregaDraft(d),
      fecha:d.fecha,ventana:d.ventana,zona:d.zona,precio:precioZona(d.zona),
      urgente:d.urgente,fragil:d.fragil,notas:d.notas,paquetes:d.paquetes.map(p=>({tam:p.tam}))});
    ENVIOS.unshift(e);DRAFT=null;TAB=ROL==='cliente'?'mis':'envios';CREATED=e.id;topPage();render();return}
});

document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='m-cli'&&MAS){MAS.cliente=t.value;MAS.err=null;render();return}
  if(t.id==='f-cli'){DRAFT.cliente=t.value;DRAFT.retiro='';DRAFT.retiroNuevo='';DRAFT.favRetiro=false;render();return}
  if(t.id==='f-ret'){DRAFT.retiro=t.value;DRAFT.retiroNuevo='';DRAFT.favRetiro=false;DRAFT.err.retiro=null;render();return}
  if(t.id==='f-fav-ret'){DRAFT.favRetiro=t.checked;return}
  if(t.id==='f-zona'){DRAFT.zona=t.value;DRAFT.fecha=jornadasZona(DRAFT.zona)[0];
    if(DRAFT.ventana&&!franjaVigente(DRAFT.ventana,DRAFT.fecha))DRAFT.ventana='';
    DRAFT.err.entrega=null;render();return}
  if(t.id==='f-ent-loc'){DRAFT.entregaCosta.loc=t.value;DRAFT.err.entrega=null;render();return}
  if(t.id==='f-ven'){DRAFT.ventana=t.value;return}
  if(t.id==='f-urg'){DRAFT.urgente=!!t.value;return}
  if(t.dataset.pick&&PICK){PICK.sel=t.checked?[...PICK.sel,t.dataset.pick]:PICK.sel.filter(x=>x!==t.dataset.pick);render();return}
});

document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){vEnvios.q=t.value;const p=t.selectionStart;render();
    const n=document.querySelector('#q');if(n){n.focus();n.setSelectionRange(p,p)}return}
  if(t.dataset.base){
    const c=CAD.find(x=>x.id===t.dataset.base);
    if(c)c.base=t.value;
    return}
  if(t.id==='f-dest')DRAFT.dest=t.value;
  if(t.id==='f-ret-new'){DRAFT.retiroNuevo=t.value;DRAFT.err.retiro=null}
  if(t.id==='f-tel')DRAFT.tel=t.value;
  if(t.id==='f-ent'){DRAFT.entrega=t.value;DRAFT.err.entrega=null}
  if(t.id==='f-ent-otra'){DRAFT.entregaCosta.otra=t.value;DRAFT.err.entrega=null}
  if(t.id==='f-ent-calle'){DRAFT.entregaCosta.calle=t.value;DRAFT.err.entrega=null}
  if(t.id==='f-ent-manzana'){DRAFT.entregaCosta.manzana=t.value;DRAFT.err.entrega=null}
  if(t.id==='f-ent-solar'){DRAFT.entregaCosta.solar=t.value;DRAFT.err.entrega=null}
  if(t.id==='f-ent-desc'){DRAFT.entregaCosta.desc=t.value;DRAFT.err.entrega=null}
  if(t.id==='f-not')DRAFT.notas=t.value;
  if(t.id==='op-obs'&&OP)OP.obs=t.value;
  if(t.id==='op-rec'&&OP){OP.receptor=t.value;OP.err=null}
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'){
  if(CAL)CAL=false;else if(ATRAS)ATRAS=null;else if(MOVE)MOVE=null;else if(JORNADA)JORNADA=false;else if(PICK)PICK=null;else if(OP)OP=null;else if(SEL)SEL=null;else return;render()}});

render();
</script>
</body>
</html>
